name: Deploy Static Website to GitHub Pages

# Controls when the workflow will run
on:
  # Trigger the workflow automatically on push to the main branch
  push:
    branches:
      - main

  # Allows manual execution of this workflow from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read      # Needed to checkout repository code
  pages: write         # Needed to upload and deploy to GitHub Pages
  id-token: write      # Needed to verify GitHub Pages deployment tokens

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs to allow deployments to complete cleanly.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build Job: Installs dependencies, runs tests, compiles project & uploads artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend # Execute commands in the frontend directory where the static site lives
    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Step 3: Install reproducible dependencies using npm ci
      - name: Install dependencies
        run: npm ci

      # Step 4: Run automated tests and code quality verification
      - name: Run tests
        run: npm test

      # Step 5: Compile and build the static production bundle
      - name: Build static website
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}

      # Step 6: Configure GitHub Pages metadata (supports base URLs and custom domains)
      - name: Setup Pages configuration
        uses: actions/configure-pages@v5

      # Step 7: Upload the compiled static files as an artifact for GitHub Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist' # Path to compiled static assets generated by Vite

  # ---------------------------------------------------------------------------
  # Deploy Job: Takes the uploaded artifact and publishes it to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build # Ensures deploy only runs after a successful build & test phase
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Live website URL output from the deployment step
    steps:
      # Step 1: Deploy the uploaded artifact to GitHub Pages infrastructure using official action
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
